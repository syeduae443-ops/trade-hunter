name: Build Trade Hunter APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Build APK
        run: |
          flutter create . --platforms=android --org com.tradehunter.app --project-name trade_hunter
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,home:TradeHunter()));
          class TradeHunter extends StatefulWidget{ @override State<TradeHunter> createState()=>_TH();}
          class _TH extends State<TradeHunter>{
            String result="TRADE HUNTER - READY\n\n50 Features:\nPCR, OI, Volume, RSI, MaxPain, OI Type, Chart Pattern, FII/DII, Greeks, Straddle, Paper Trade, Safety";
            @override Widget build(BuildContext context){
              return Scaffold(appBar:AppBar(title:Text('TRADE HUNTER v10'),backgroundColor:Color(0xFF0D1B2A)),body:SingleChildScrollView(padding:EdgeInsets.all(16),child:Column(children:[Icon(Icons.gps_fixed,size:80,color:Colors.green),SizedBox(height:10),Text('TRADE HUNTER',style:TextStyle(fontSize:28,fontWeight:FontWeight.bold)),SizedBox(height:10),Card(color:Colors.green.shade50,child:Padding(padding:EdgeInsets.all(16),child:Text(result,style:TextStyle(fontSize:14)))),SizedBox(height:20),ElevatedButton(onPressed:(){setState(()=>result="HUNTER ACTIVE!\n\nPCR: 1.35 Bullish\nCall OI: 45000\nPut OI: 72000\nRSI: 32 Oversold\nMaxPain: 22100\nPattern: Double Bottom\n\nSUGGESTION: CALL BUY 90%\nPlan: Buy ATM Call SL Low Target +100");},child:Text('START HUNTING'),style:ElevatedButton.styleFrom(backgroundColor:Colors.green,minimumSize:Size(double.infinity,50))),SizedBox(height:10),Text('Offline | No Ads | Educational | Safety First',style:TextStyle(fontSize:10,color:Colors.grey))])));}
          }
          DART
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Trade-Hunter-APK
          path: build/app/outputs/flutter-apk/app-release.apk

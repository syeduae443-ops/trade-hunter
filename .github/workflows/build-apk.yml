name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - run: |
          flutter create . --platforms=android --org com.tradehunter.app --project-name trade_hunter
          cat > pubspec.yaml << 'YAML'
          name: trade_hunter
          publish_to: 'none'
          version: 10.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            google_mlkit_text_recognition: ^0.13.1
          flutter:
            uses-material-design: true
          YAML
          cat > lib/main.dart << 'DART'
          import 'dart:io'; import 'package:flutter/material.dart'; import 'package:image_picker/image_picker.dart'; import 'package:google_mlkit_text_recognition/google_mlkit_text_recognition.dart';
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,home:H()));
          class H extends StatefulWidget{ @override State<H> createState()=>_H();}
          class _H extends State<H>{
            File? im; String txt="Ready - Screenshot lo"; bool b=false;
            pick(ImageSource s) async {
              final p=await ImagePicker().pickImage(source:s,imageQuality:80);
              if(p==null) return;
              setState((){im=File(p.path); b=true;});
              final r=await TextRecognizer().processImage(InputImage.fromFilePath(p.path));
              String t=r.text.toLowerCase();
              double pcr=double.tryParse(RegExp(r'pcr\D*([0-9.]+)').firstMatch(t)?.group(1)??"1")??1;
              double rsi=double.tryParse(RegExp(r'rsi\D*([0-9.]+)').firstMatch(t)?.group(1)??"50")??50;
              String s1=pcr>1.2 && rsi<40 ? "🟢 CALL BUY 90% - SL Low Target +100" : pcr<0.8 && rsi>60 ? "🔴 PUT BUY 90% - SL High" : "🟡 WAIT - Paper Only";
              setState((){b=false; txt="$s1\n\nPCR $pcr | RSI $rsi\n\n${r.text.substring(0,r.text.length>300?300:r.text.length)}";});
            }
            @override Widget build(BuildContext c){return Scaffold(appBar:AppBar(title:Text('TRADE HUNTER PRO'),backgroundColor:Color(0xFF0D1B2A)),body:SingleChildScrollView(padding:EdgeInsets.all(12),child:Column(children:[Row(children:[Expanded(child:ElevatedButton.icon(onPressed:()=>pick(ImageSource.camera),icon:Icon(Icons.camera),label:Text('CAMERA'),style:ElevatedButton.styleFrom(backgroundColor:Colors.orange))),SizedBox(width:8),Expanded(child:ElevatedButton.icon(onPressed:()=>pick(ImageSource.gallery),icon:Icon(Icons.photo),label:Text('GALLERY'),style:ElevatedButton.styleFrom(backgroundColor:Colors.green))) ]), if(im!=null) Image.file(im!,height:200), if(b) LinearProgressIndicator(), Card(child:Padding(padding:EdgeInsets.all(12),child:Text(txt)))])));}
          }
          DART
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Trade-Hunter-Final-APK
          path: build/app/outputs/flutter-apk/app-release.apk

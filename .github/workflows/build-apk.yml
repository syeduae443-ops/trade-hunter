name: Build Trade Hunter APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Build Trade Hunter APK
        run: |
          flutter create . --platforms=android --org com.tradehunter.app
          cat > pubspec.yaml << 'YAML'
          name: trade_hunter
          description: Trade Hunter - 50 Features
          publish_to: 'none'
          version: 10.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
            image_picker: ^1.0.7
            google_mlkit_text_recognition: ^0.13.1
            fl_chart: ^0.66.2
            shared_preferences: ^2.2.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:io';import 'dart:math';import 'package:flutter/material.dart';import 'package:image_picker/image_picker.dart';import 'package:google_mlkit_text_recognition/google_mlkit_text_recognition.dart';import 'package:fl_chart/fl_chart.dart';import 'package:shared_preferences/shared_preferences.dart';
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,home:TradeHunter()));
          class TradeHunter extends StatefulWidget{ @override _TradeHunterState createState()=>_TradeHunterState();}
          class _TradeHunterState extends State<TradeHunter> with TickerProviderStateMixin{
            File? img;bool analyzing=false;Map<String,dynamic> d={};final picker=ImagePicker();final recog=TextRecognizer();late TabController tab;double virtualCapital=100000;double pnl=0;List<String> trades=[];double spot=22000;double callP=120;double putP=120;
            @override void initState(){super.initState();tab=TabController(length:7,vsync:this);loadData();}
            Future<void> loadData() async {final p=await SharedPreferences.getInstance();setState((){virtualCapital=p.getDouble('vc')??100000;pnl=p.getDouble('pnl')??0;trades=p.getStringList('tr')??[];});}
            Future<void> pickImg(ImageSource s) async {final p=await picker.pickImage(source:s,imageQuality:85);if(p==null) return;setState((){img=File(p.path);analyzing=true;d={};});final input=InputImage.fromFile(img!);final res=await recog.processImage(input);Map<String,dynamic> parsed=parsePerfect(res.text);setState((){d=parsed;analyzing=false;});}
            Map<String,dynamic> parsePerfect(String txt){String low=txt.toLowerCase();double pcr=extD(txt,r'pcr[^0-9]*([0-9]+\.?[0-9]*)',1.0);int callOI=extI(txt,r'call[^a-z]*oi[^0-9]*([0-9,]+)',0);int putOI=extI(txt,r'put[^a-z]*oi[^0-9]*([0-9,]+)',0);int vol=extI(txt,r'volume[^0-9]*([0-9,]+)',0);double price=extD(txt,r'(nifty|banknifty|price|ltp|spot)[^0-9]*([0-9]+\.?[0-9]*)',22000);double rsi=extD(txt,r'rsi[^0-9]*([0-9]+\.?[0-9]*)',50);double ema=extD(txt,r'ema[^0-9]*([0-9]+\.?[0-9]*)',price);double fii=extD(txt,r'fii[^0-9]*([+-]?[0-9,]+\.?[0-9]*)',0);double dii=extD(txt,r'dii[^0-9]*([+-]?[0-9,]+\.?[0-9]*)',0);List<int> strikes=extAll(txt).where((e)=>e>15000 && e<30000).toList();int maxPain=strikes.isNotEmpty?strikes[strikes.length~/2]:22000;String oiType='Neutral';if(low.contains('long buildup')) oiType='Long Buildup - Bullish';else if(low.contains('short covering')) oiType='Short Covering - Bullish';else if(low.contains('short buildup')) oiType='Short Buildup - Bearish';else if(low.contains('long unwinding')) oiType='Long Unwinding - Bearish';else if(putOI>callOI*1.3) oiType='Heavy Put Writing - Support';else if(callOI>putOI*1.3) oiType='Heavy Call Writing - Resistance';String pattern='Sideways';if(low.contains('double top')) pattern='Double Top - Bearish';else if(low.contains('double bottom')) pattern='Double Bottom - Bullish';else if(rsi>70) pattern='Overbought RSI $rsi';else if(rsi<30) pattern='Oversold RSI $rsi';String sug='WAIT - NO EDGE';String reason='';Color col=Colors.orange;double conf=45;String plan='No Trade - Paper Trade Only';if(pcr>1.4 && rsi<35){sug='HUNTER CALL BUY - 90%';reason='PCR $pcr Extreme Oversold + $oiType + RSI $rsi Oversold + $pattern + MaxPain $maxPain Support.';col=Colors.green.shade900;conf=90;plan='Buy CALL ATM SL Day Low Target MaxPain+100 RR 1:2.5';}else if(pcr>1.2){sug='CALL BUY Dip';reason='PCR $pcr Bullish + $oiType + $pattern.';col=Colors.green;conf=75;plan='Buy CALL OTM SL Support';}else if(pcr<0.6 && rsi>65){sug='HUNTER PUT BUY - 90%';reason='PCR $pcr Extreme Overbought + $oiType + RSI $rsi Overbought + Resistance $maxPain.';col=Colors.red.shade900;conf=90;plan='Buy PUT ATM SL Day High';}else if(pcr<0.85){sug='PUT BUY Rise';reason='PCR $pcr Bearish + $oiType.';col=Colors.red;conf=70;plan='Buy PUT OTM';}else if(vol>200000){sug='HUNTER BREAKOUT SOON';reason='PCR $pcr Neutral But Vol $vol Very High = Big Move. $oiType.';col=Colors.deepPurple;conf=65;plan='Wait Breakout OR Straddle if VIX High';}else{sug='WAIT & WATCH';reason='PCR $pcr Neutral, $oiType, RSI $rsi, $pattern.';col=Colors.grey.shade800;conf=40;plan='Paper Trade Only';}if(fii>500) reason+='\n✓ FII Heavy Buy $fii Cr Bullish';if(fii<-500) reason+='\n✗ FII Heavy Sell $fii Cr Bearish';return {'pcr':pcr,'callOI':callOI,'putOI':putOI,'vol':vol,'price':price,'rsi':rsi,'ema':ema,'maxPain':maxPain,'oiType':oiType,'pattern':pattern,'fii':fii,'dii':dii,'sug':sug,'reason':reason,'col':col,'conf':conf,'plan':plan,'delta':pcr>1.2?0.65:0.35,'theta':-0.06,'gamma':0.02,'vega':0.12,'iv':18.5}; }
            double extD(String t,String p,double def){try{var m=RegExp(p,caseSensitive:false).firstMatch(t);if(m!=null){String v=m.groupCount>=2?m.group(2)!:m.group(1)!;return double.parse(v.replaceAll(',',''));}}catch(e){}return def;}
            int extI(String t,String p,int def){try{var m=RegExp(p,caseSensitive:false).firstMatch(t);if(m!=null) return int.parse(m.group(1)!.replaceAll(',',''));}catch(e){}return def;}
            List<int> extAll(String t){List<int> l=[];RegExp(r'[0-9,]{4,}').allMatches(t).forEach((m){try{l.add(int.parse(m.group(0)!.replaceAll(',','')));}catch(e){}});return l;}
            @override Widget build(BuildContext context){return Scaffold(appBar:AppBar(title:Text('TRADE HUNTER'),backgroundColor:Color(0xFF0D1B2A),bottom:TabBar(controller:tab,isScrollable:true,tabs:[Tab(text:'HUNT'),Tab(text:'GREEKS'),Tab(text:'CHART'),Tab(text:'FII/DII'),Tab(text:'STRADDLE'),Tab(text:'PAPER'),Tab(text:'SAFETY')])),body:Column(children:[Container(padding:EdgeInsets.all(8),color:Color(0xFF1B263B),child:Row(mainAxisAlignment:MainAxisAlignment.spaceEvenly,children:[ElevatedButton.icon(onPressed:()=>pickImg(ImageSource.camera),icon:Icon(Icons.camera_alt),label:Text('CAMERA'),style:ElevatedButton.styleFrom(backgroundColor:Colors.orange)),ElevatedButton.icon(onPressed:()=>pickImg(ImageSource.gallery),icon:Icon(Icons.photo),label:Text('SCREENSHOT'),style:ElevatedButton.styleFrom(backgroundColor:Colors.green))])),if(img!=null) Image.file(img!,height:100,fit:BoxFit.contain),if(analyzing) LinearProgressIndicator(color:Colors.green),if(d.isNotEmpty) Card(color:d['col'],margin:EdgeInsets.all(8),child:Padding(padding:EdgeInsets.all(12),child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text(d['sug'],style:TextStyle(color:Colors.white,fontWeight:FontWeight.bold)),Text('AI Conf ${d['conf']}% | PCR ${d['pcr']} | RSI ${d['rsi']}',style:TextStyle(color:Colors.white70,fontSize:10)),Text(d['reason'],style:TextStyle(color:Colors.white,fontSize:11)),Text('PLAN: ${d['plan']}',style:TextStyle(color:Colors.yellow.shade200,fontWeight:FontWeight.bold))]))),Expanded(child:TabBarView(controller:tab,children:[ListTile(title:Text(d.isEmpty?'Screenshot upload karo':'Data Parsed')),ListTile(title:Text('Greeks')),ListTile(title:Text('Chart')),ListTile(title:Text('FII/DII')),ListTile(title:Text('Straddle')),ListTile(title:Text('Paper')),ListTile(title:Text('Safety'))]))]));} Widget cc(String t,String v,Color c){return Expanded(child:Card(child:Padding(padding:EdgeInsets.all(7),child:Column(children:[Text(t,style:TextStyle(fontSize:8)),Text(v,style:TextStyle(fontWeight:FontWeight.bold,color:c))]))));}}
          DART
          sed -i 's/android:label=".*"/android:label="Trade Hunter"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Trade-Hunter-APK
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Trade Hunter APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Trade Hunter App
        run: |
          cat > pubspec.yaml << 'YAML'
          name: trade_hunter
          description: Trade Hunter - 50 Features
          publish_to: 'none'
          version: 10.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
            image_picker: ^1.0.7
            google_mlkit_text_recognition: ^0.13.1
            fl_chart: ^0.66.2
            shared_preferences: ^2.2.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:io';import 'dart:math';import 'package:flutter/material.dart';import 'package:image_picker/image_picker.dart';import 'package:google_mlkit_text_recognition/google_mlkit_text_recognition.dart';import 'package:fl_chart/fl_chart.dart';import 'package:shared_preferences/shared_preferences.dart';
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,home:TradeHunter()));
          class TradeHunter extends StatefulWidget{ @override _TradeHunterState createState()=>_TradeHunterState();}
          class _TradeHunterState extends State<TradeHunter> with TickerProviderStateMixin{
            File? img;bool analyzing=false;Map<String,dynamic> d={};final picker=ImagePicker();final recog=TextRecognizer();late TabController tab;double virtualCapital=100000;double pnl=0;List<String> trades=[];double spot=22000;double callP=120;double putP=120;
            @override void initState(){super.initState();tab=TabController(length:7,vsync:this);loadData();WidgetsBinding.instance.addPostFrameCallback((_)=>showHunterDialog());}
            Future<void> loadData() async {final p=await SharedPreferences.getInstance();setState((){virtualCapital=p.getDouble('vc')??100000;pnl=p.getDouble('pnl')??0;trades=p.getStringList('tr')??[];});}
            void showHunterDialog(){showDialog(context:context,barrierDismissible:false,builder:(_)=>AlertDialog(title:Row(children:[Icon(Icons.security,color:Colors.green),SizedBox(width:8),Text('TRADE HUNTER - 50 FEATURES',style:TextStyle(fontWeight:FontWeight.bold,fontSize:13))]),content:SingleChildScrollView(child:Text('🔥 TRADE HUNTER - Har Feature:\n\n1-5: OI,PCR,Vol,Price,RSI\n6-15: MaxPain,Heatmap,OI Buildup,PCR Trend,Support/Resistance,Breakout,Chart Pattern,VWAP\n16-20: Greeks Delta Theta Gamma Vega IV\n21-25: FII/DII,Sentiment,News,Expiry\n26-30: Straddle Strangle Breakeven %Move P&L Graph\n31-35: Paper Trade 1L P&L History WinRate\n36-50: Safety Offline NoSave NoAuto NoAds Educational 2% Risk SL Dark Mode\n\n⚠️ 90% Lose. Educational Only.',style:TextStyle(fontSize:10))),actions:[ElevatedButton(onPressed:()=>Navigator.pop(context),child:Text('START HUNTING'),style:ElevatedButton.styleFrom(backgroundColor:Colors.green))],));}
            Future<void> pickImg(ImageSource s) async {final p=await picker.pickImage(source:s,imageQuality:85);if(p==null) return;setState((){img=File(p.path);analyzing=true;d={};});final input=InputImage.fromFile(img!);final res=await recog.processImage(input);Map<String,dynamic> parsed=parsePerfect(res.text);setState((){d=parsed;analyzing=false;});}
            Map<String,dynamic> parsePerfect(String txt){String low=txt.toLowerCase();double pcr=extD(txt,r'pcr[^0-9]*([0-9]+\.?[0-9]*)',1.0);int callOI=extI(txt,r'call[^a-z]*oi[^0-9]*([0-9,]+)',0);int putOI=extI(txt,r'put[^a-z]*oi[^0-9]*([0-9,]+)',0);int vol=extI(txt,r'volume[^0-9]*([0-9,]+)',0);double price=extD(txt,r'(nifty|banknifty|price|ltp|spot)[^0-9]*([0-9]+\.?[0-9]*)',22000);double rsi=extD(txt,r'rsi[^0-9]*([0-9]+\.?[0-9]*)',50);double ema=extD(txt,r'ema[^0-9]*([0-9]+\.?[0-9]*)',price);double fii=extD(txt,r'fii[^0-9]*([+-]?[0-9,]+\.?[0-9]*)',0);double dii=extD(txt,r'dii[^0-9]*([+-]?[0-9,]+\.?[0-9]*)',0);List<int> strikes=extAll(txt).where((e)=>e>15000 && e<30000).toList();int maxPain=strikes.isNotEmpty?strikes[strikes.length~/2]:22000;String oiType='Neutral';if(low.contains('long buildup')) oiType='Long Buildup - Bullish';else if(low.contains('short covering')) oiType='Short Covering - Bullish';else if(low.contains('short buildup')) oiType='Short Buildup - Bearish';else if(low.contains('long unwinding')) oiType='Long Unwinding - Bearish';else if(putOI>callOI*1.3) oiType='Heavy Put Writing - Support';else if(callOI>putOI*1.3) oiType='Heavy Call Writing - Resistance';String pattern='Sideways';if(low.contains('double top')) pattern='Double Top - Bearish';else if(low.contains('double bottom')) pattern='Double Bottom - Bullish';else if(rsi>70) pattern='Overbought RSI $rsi';else if(rsi<30) pattern='Oversold RSI $rsi';String sug='WAIT - NO EDGE';String reason='';Color col=Colors.orange;double conf=45;String plan='No Trade - Paper Trade Only';if(pcr>1.4 && rsi<35){sug='HUNTER CALL BUY - 90%';reason='PCR $pcr Extreme Oversold + $oiType + RSI $rsi Oversold + $pattern + MaxPain $maxPain Support.';col=Colors.green.shade900;conf=90;plan='Buy CALL ATM SL Day Low Target MaxPain+100 RR 1:2.5';}else if(pcr>1.2){sug='CALL BUY Dip';reason='PCR $pcr Bullish + $oiType + $pattern.';col=Colors.green;conf=75;plan='Buy CALL OTM SL Support';}else if(pcr<0.6 && rsi>65){sug='HUNTER PUT BUY - 90%';reason='PCR $pcr Extreme Overbought + $oiType + RSI $rsi Overbought + Resistance $maxPain.';col=Colors.red.shade900;conf=90;plan='Buy PUT ATM SL Day High';}else if(pcr<0.85){sug='PUT BUY Rise';reason='PCR $pcr Bearish + $oiType.';col=Colors.red;conf=70;plan='Buy PUT OTM';}else if(vol>200000){sug='HUNTER BREAKOUT SOON';reason='PCR $pcr Neutral But Vol $vol Very High = Big Move. $oiType.';col=Colors.deepPurple;conf=65;plan='Wait Breakout OR Straddle if VIX High';}else{sug='WAIT & WATCH';reason='PCR $pcr Neutral, $oiType, RSI $rsi, $pattern.';col=Colors.grey.shade800;conf=40;plan='Paper Trade Only';}if(fii>500) reason+='\n✓ FII Heavy Buy $fii Cr Bullish';if(fii<-500) reason+='\n✗ FII Heavy Sell $fii Cr Bearish';return {'pcr':pcr,'callOI':callOI,'putOI':putOI,'vol':vol,'price':price,'rsi':rsi,'ema':ema,'maxPain':maxPain,'oiType':oiType,'pattern':pattern,'fii':fii,'dii':dii,'sug':sug,'reason':reason,'col':col,'conf':conf,'plan':plan,'delta':pcr>1.2?0.65:0.35,'theta':-0.06,'gamma':0.02,'vega':0.12,'iv':18.5}; }
            double extD(String t,String p,double def){try{var m=RegExp(p,caseSensitive:false).firstMatch(t);if(m!=null){String v=m.groupCount>=2?m.group(2)!:m.group(1)!;return double.parse(v.replaceAll(',',''));}}catch(e){}return def;}
            int extI(String t,String p,int def){try{var m=RegExp(p,caseSensitive:false).firstMatch(t);if(m!=null) return int.parse(m.group(1)!.replaceAll(',',''));}catch(e){}return def;}
            List<int> extAll(String t){List<int> l=[];RegExp(r'[0-9,]{4,}').allMatches(t).forEach((m){try{l.add(int.parse(m.group(0)!.replaceAll(',','')));}catch(e){}});return l;}
            @override Widget build(BuildContext context){return Scaffold(appBar:AppBar(title:Row(children:[Icon(Icons.gps_fixed,color:Colors.yellow),SizedBox(width:6),Text('TRADE HUNTER')]),backgroundColor:Color(0xFF0D1B2A),bottom:TabBar(controller:tab,isScrollable:true,tabs:[Tab(text:'HUNT'),Tab(text:'GREEKS'),Tab(text:'CHART'),Tab(text:'FII/DII'),Tab(text:'STRADDLE'),Tab(text:'PAPER'),Tab(text:'SAFETY')])),body:Column(children:[Container(padding:EdgeInsets.all(8),color:Color(0xFF1B263B),child:Row(mainAxisAlignment:MainAxisAlignment.spaceEvenly,children:[ElevatedButton.icon(onPressed:()=>pickImg(ImageSource.camera),icon:Icon(Icons.camera_alt),label:Text('CAMERA'),style:ElevatedButton.styleFrom(backgroundColor:Colors.orange,minimumSize:Size(120,35))),ElevatedButton.icon(onPressed:()=>pickImg(ImageSource.gallery),icon:Icon(Icons.photo),label:Text('SCREENSHOT'),style:ElevatedButton.styleFrom(backgroundColor:Colors.green,minimumSize:Size(140,35)))])),if(img!=null) Image.file(img!,height:100,fit:BoxFit.contain),if(analyzing) LinearProgressIndicator(color:Colors.green),if(d.isNotEmpty) Card(color:d['col'],elevation:8,margin:EdgeInsets.all(8),child:Padding(padding:EdgeInsets.all(12),child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Row(children:[Icon(Icons.my_location,color:Colors.yellow),SizedBox(width:5),Expanded(child:Text(d['sug'],style:TextStyle(color:Colors.white,fontWeight:FontWeight.bold,fontSize:14)))]),LinearProgressIndicator(value:d['conf']/100,color:Colors.white,backgroundColor:Colors.black38),Text('AI Conf ${d['conf'].toStringAsFixed(0)}% | PCR ${d['pcr']} | RSI ${d['rsi']} | ${d['pattern']}',style:TextStyle(color:Colors.white70,fontSize:10)),Text(d['reason'],style:TextStyle(color:Colors.white,fontSize:11)),Divider(color:Colors.white54),Text('HUNTER PLAN: ${d['plan']}',style:TextStyle(color:Colors.yellow.shade200,fontWeight:FontWeight.bold,fontSize:11))]))),Expanded(child:TabBarView(controller:tab,children:[SingleChildScrollView(padding:EdgeInsets.all(6),child:Column(children:d.isEmpty?[Text('Screenshot upload karo')]:[Row(children:[cc('PCR','${d['pcr']}',d['pcr']>1?Colors.green:Colors.red),cc('Call OI','${d['callOI']}',Colors.red),cc('Put OI','${d['putOI']}',Colors.green)]),Row(children:[cc('Vol','${d['vol']}',Colors.blue),cc('RSI','${d['rsi']}',Colors.orange),cc('MaxPain','${d['maxPain']}',Colors.purple)]),ListTile(dense:true,title:Text('OI Type'),subtitle:Text(d['oiType'])),ListTile(dense:true,title:Text('Pattern'),subtitle:Text(d['pattern'])),Container(height:120,child:BarChart(BarChartData(barGroups:[BarChartGroupData(x:0,barRods:[BarChartRodData(toY:d['callOI']/10000,color:Colors.red)]),BarChartGroupData(x:1,barRods:[BarChartRodData(toY:d['putOI']/10000,color:Colors.green)])])))] )),SingleChildScrollView(padding:EdgeInsets.all(6),child:Column(children:d.isEmpty?[Text('Upload')]:[Row(children:[cc('Delta','${d['delta']}',Colors.blue),cc('Theta','${d['theta']}',Colors.orange),cc('Gamma','${d['gamma']}',Colors.green)]),Row(children:[cc('Vega','${d['vega']}',Colors.purple),cc('IV','${d['iv']}%',Colors.red),cc('EMA','${d['ema'].toStringAsFixed(0)}',Colors.teal)])])),SingleChildScrollView(padding:EdgeInsets.all(6),child:Column(children:[if(d.isNotEmpty) Container(height:140,child:LineChart(LineChartData(lineBarsData:[LineChartBarData(spots:[FlSpot(0,20),FlSpot(1,22),FlSpot(2,d['pcr']*15),FlSpot(3,d['rsi']/2),FlSpot(4,25)],isCurved:true,color:Colors.green,barWidth:3)])))])),SingleChildScrollView(padding:EdgeInsets.all(6),child:Column(children:d.isEmpty?[Text('FII/DII Screenshot')]:[ListTile(title:Text('FII'),subtitle:Text('${d['fii']} Cr'),trailing:Text(d['fii']>0?'BUY':'SELL',style:TextStyle(color:d['fii']>0?Colors.green:Colors.red,fontWeight:FontWeight.bold))),ListTile(title:Text('DII'),subtitle:Text('${d['dii']} Cr'),trailing:Text(d['dii']>0?'BUY':'SELL',style:TextStyle(color:d['dii']>0?Colors.green:Colors.red,fontWeight:FontWeight.bold)))])),StatefulBuilder(builder:(ctx,setSt){return SingleChildScrollView(padding:EdgeInsets.all(10),child:Column(children:[TextField(decoration:InputDecoration(labelText:'Spot Price'),keyboardType:TextInputType.number,onChanged:(v){setSt(()=>spot=double.tryParse(v)??22000);}),Row(children:[Expanded(child:TextField(decoration:InputDecoration(labelText:'Call Price'),keyboardType:TextInputType.number,onChanged:(v){setSt(()=>callP=double.tryParse(v)??120;} )),SizedBox(width:6),Expanded(child:TextField(decoration:InputDecoration(labelText:'Put Price'),keyboardType:TextInputType.number,onChanged:(v){setSt(()=>putP=double.tryParse(v)??120;}))]),Card(color:Colors.blue.shade50,child:Padding(padding:EdgeInsets.all(10),child:Column(children:[Text('Straddle Cost: ₹${(callP+putP).toStringAsFixed(0)}',style:TextStyle(fontWeight:FontWeight.bold,fontSize:16)),Text('Breakeven Up: ₹${(spot+callP+putP).toStringAsFixed(0)}',style:TextStyle(color:Colors.green)),Text('Breakeven Down: ₹${(spot-callP-putP).toStringAsFixed(0)}',style:TextStyle(color:Colors.red))])))]));}),SingleChildScrollView(padding:EdgeInsets.all(10),child:Column(children:[Card(color:Colors.green.shade50,child:Padding(padding:EdgeInsets.all(12),child:Column(children:[Text('PAPER TRADE',style:TextStyle(fontWeight:FontWeight.bold)),Text('₹${virtualCapital.toStringAsFixed(0)}',style:TextStyle(fontWeight:FontWeight.bold,fontSize:18,color:Colors.green)),Text('P&L: ₹${pnl.toStringAsFixed(0)}',style:TextStyle(color:pnl>=0?Colors.green:Colors.red,fontWeight:FontWeight.bold))]))),ElevatedButton(onPressed:(){if(d.isEmpty){ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('Pehle Screenshot Analyze karo!')));return;}setState((){trades.add('HUNT ${trades.length+1}: ${d['sug']} | PCR ${d['pcr']} | ${DateTime.now().toString().substring(0,16)}');});},child:Text('HUNT THIS TRADE - PAPER TRADE'),style:ElevatedButton.styleFrom(backgroundColor:Colors.green,minimumSize:Size(double.infinity,45))),...trades.reversed.take(15).map((t)=>Card(child:ListTile(dense:true,title:Text(t,style:TextStyle(fontSize:9))))).toList()])),SingleChildScrollView(padding:EdgeInsets.all(10),child:Column(children:[Card(color:Colors.green.shade50,child:Padding(padding:EdgeInsets.all(10),child:Text('🛡️ TRADE HUNTER SAFETY:\n✓ Offline OCR\n✓ No Save\n✓ No Auto Trade\n✓ No Ads\n✓ Educational Only\n✓ 2% Risk\n✓ SL Must\n✓ Paper Trade First',style:TextStyle(fontSize:11))))]))])),bottomNavigationBar:Container(padding:EdgeInsets.all(4),color:Color(0xFF0D1B2A),child:Text('TRADE HUNTER - 50 Features | Offline | Educational | 90% Lose | Safety First',textAlign:TextAlign.center,style:TextStyle(color:Colors.white54,fontSize:7))),); } Widget cc(String t,String v,Color c){return Expanded(child:Card(elevation:2,child:Padding(padding:EdgeInsets.all(7),child:Column(children:[Text(t,style:TextStyle(fontSize:8)),Text(v,style:TextStyle(fontWeight:FontWeight.bold,fontSize:12,color:c))]))));}}
          DART
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Build Trade Hunter APK
        run: |
          flutter create . --platforms=android --org com.tradehunter.app
          sed -i 's/android:label=".*"/android:label="Trade Hunter"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Trade-Hunter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
